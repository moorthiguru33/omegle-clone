[build]
  publish = "."
  command = "echo 'Admin panel - no build needed'"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# ── Security ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    X-Robots-Tag              = "noindex, nofollow"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.netlify.app https://*.netlify.com https://api.groq.com https://*.cloudinary.com https://api.cloudinary.com https://api.github.com https://www.mediafire.com https://api.mediafire.com https://drive.google.com; worker-src blob: 'self'; wasm-unsafe-eval 'self';"

[[headers]]
  for = "/index.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
